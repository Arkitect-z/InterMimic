params:
  seed: -1

  algo:
    name: intermimic

  model:
    name: intermimic

  network:
    name: intermimic
    separate: True

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.9
        fixed_sigma: True
        learn_sigma: False

    mlp:
      units: [1024, 1024, 512]
      activation: relu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False

  config:
    name: mimic
    full_experiment_name: theia_smplx
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: False
    reward_shaper:
      scale_value: 1
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    # From-scratch/default InterMimic optimization. Do not replace this with
    # the 1e-6 single-sequence preservation setting for unseen server data.
    learning_rate: 2e-5
    lr_schedule: constant
    score_to_win: 20000
    max_epochs: 20000
    save_best_after: 50
    save_frequency: 50
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: False
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 16384
    mini_epochs: 6
    critic_coef: 5
    clip_value: False
    seq_len: 4
    bounds_loss_coef: 10
    enable_eps_greedy: False
    save_intermediate: False
    # Fixed, preregistered checkpoints for learning curves. Unlike
    # save_intermediate, this does not retain every periodic checkpoint.
    checkpoint_milestones: [2000, 5000, 10000, 15000, 20000, 22000]
    resume_from: None
    # A server restart must restore optimizer/epoch/best state. Policy-only
    # transfer is intentionally not the default.
    resume_policy_only: False
    player:
      games_num: 1
      determenistic: True
      print_stats: True
