params:
  seed: -1

  algo:
    name: intermimic

  model:
    name: intermimic

  network:
    name: intermimic
    separate: True

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.9
        fixed_sigma: True
        learn_sigma: False

    mlp:
      units: [1024, 1024, 512]
      activation: relu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False

  config:
    name: mimic
    full_experiment_name: theia_smplx
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: False
    reward_shaper:
      scale_value: 1
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    # From-scratch/default InterMimic optimization. Do not replace this with
    # the 1e-6 single-sequence preservation setting for unseen server data.
    learning_rate: 2e-5
    lr_schedule: constant
    score_to_win: 20000
    max_epochs: 20000
    # Formal results use fixed milestones/final checkpoints, not reward-best.
    # Avoid eight workers repeatedly writing ~134 MB checkpoints in lockstep.
    save_reward_best: False
    save_best_after: 50
    # Update the rolling interruption checkpoint every 200 epochs.
    save_frequency: 200
    print_stats: True
    # Resource telemetry is sampled without blocking and only periodically.
    # GPU utilization is monitored by the external multi-GPU scheduler.
    usage_log_interval: 50
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: False
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 16384
    mini_epochs: 6
    critic_coef: 5
    clip_value: False
    seq_len: 4
    bounds_loss_coef: 10
    enable_eps_greedy: False
    # Keep the shared config bounded for longer legacy runs.  The formal
    # 2000-epoch protocol retains every 200-epoch checkpoint through explicit
    # milestones, whose names are also understood by the resume selector.
    save_intermediate: False
    checkpoint_milestones: [200, 400, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000]
    resume_from: None
    # A server restart must restore optimizer/epoch/best state. Policy-only
    # transfer is intentionally not the default.
    resume_policy_only: False
    player:
      games_num: 1
      determenistic: True
      print_stats: True
