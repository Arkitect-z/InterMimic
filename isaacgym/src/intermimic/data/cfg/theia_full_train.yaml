env:
  numEnvs: 2048
  envSpacing: 2
  episodeLength: 360
  isFlagrun: False
  enableDebugVis: False
  playdataset: False
  projtype: "None"
  saveImages: False
  initVel: False
  moreRigid: False
  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 2
  # Stage 1 for a completely unseen dataset: learn short segments and contact
  # transitions before asking the policy to survive every sequence end-to-end.
  stateInit: "Hybrid"
  rolloutLength: 100
  hybridInitProb: 0.1
  enableEvaluation: False
  dataFPS: 30
  dataFramesScale: 1
  # Full-dataset stage: select every sub<number>_*.pt sequence in motion_file.
  dataSub: ['*']
  ballSize: 1.
  numObs: 3858
  motion_file: theia_data
  robotType: "smplx/theia.xml"
  # Exact density is not required for large-scale training. Known objects keep
  # their measured approximations; every other object uses the default.
  objectDensity:
    default: 1000
    CupBlue: 1200
    KettleGreen: 1850
  requireObjectDensity: False
  correctContactDistance: 0.05
  referenceAngularVelocityLimit: 20.0
  # Conservative InterMimic objective with correctness fixes. Keep reference
  # contact as shaping, but never terminate merely because GT contact timing
  # was missed and never punish the approximate GPU wrong-contact signal.
  contactRewardMode: "legacy_multiplicative"
  enableContactFailureTermination: False
  enableWristFailureTermination: True
  enableObjectContactPhaseTermination: True
  contactFailureGraceFrames: 20
  # Full-scale runs omit optional scalar diagnostics and avoid per-step device
  # synchronization. Enable only for a small, isolated debug run.
  enableTrainingDiagnostics: False
  enableStepDiagnostics: False
  # Keep Stage-A segments fixed at 100 frames. One late-contact outlier must
  # not silently lengthen every sequence's rollout.
  adaptiveRolloutFromLatestContact: False
  fingerBonusWeight: 0.05
  wristBonusWeight: 0.30
  graspBonusWeight: 0.05
  wrongContactPenalty: 0.0
  terminalObjectPoseFrames: 30
  terminalObjectPoseBonusWeight: 0.0
  # Isaac FK propagation is an optional diagnostic, never a data gate.
  validateReferenceFK: False
  fkMaxPositionError: 0.015
  fkMaxRotationErrorDeg: 10.0
  requireBimanualContact: True
  minimumFootCollisionZ: -0.001
  localRootObs: False
  keyBodies: ["L_Hip", "L_Knee", "L_Ankle", "L_Toe", "R_Hip", "R_Knee", "R_Ankle", "R_Toe", "Torso", "Spine", "Chest", "Neck", "Head", "L_Thorax", "L_Shoulder", "L_Elbow", "L_Wrist", "R_Thorax", "R_Shoulder", "R_Elbow", "R_Wrist"]
  contactBodies: ["L_Hip", "L_Knee", "L_Ankle", "L_Toe", "R_Hip", "R_Knee", "R_Ankle", "R_Toe", "Torso", "Spine", "Chest", "Neck", "Head", "L_Thorax", "L_Shoulder", "L_Elbow", "L_Wrist", "R_Thorax", "R_Shoulder", "R_Elbow", "R_Wrist", "L_Index3", "L_Middle3", "L_Pinky3", "L_Ring3", "L_Thumb3", "R_Index3", "R_Middle3", "R_Pinky3", "R_Ring3", "R_Thumb3"]
  terminationHeight: 0.15
  enableEarlyTermination: True
  physicalBufferSize: 1

  asset:
    assetRoot: "intermimic/data/assets"

  plane:
    staticFriction: 0.9
    dynamicFriction: 0.9
    restitution: 0.1

  rewardWeights:
    p: 30.
    r: 2.5
    pv: 0.
    rv: 0.
    op: 5.0
    or: 1.0
    opv: 0.1
    orv: 0.
    ig: 5.
    cg_hand: 5.
    cg_other: 5.
    cg_all: 3.
    finger: 5.0
    eg1: 0.00002
    eg2: 0.00002
    eg3: 0.000000001

sim:
  substeps: 4
  physx:
    num_threads: 4
    solver_type: 1
    num_position_iterations: 8
    num_velocity_iterations: 2
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1.0

  flex:
    num_inner_iterations: 10
    warm_start: 0.25
