env:
  numEnvs: 128
  envSpacing: 2
  episodeLength: 360
  isFlagrun: False
  enableDebugVis: False
  playdataset: False
  projtype: "None"
  saveImages: False
  initVel: False
  moreRigid: False
  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 2
  stateInit: "Start"
  rolloutLength: 339
  # At load time this becomes the longest selected sequence; each shorter
  # sequence still ends at its own final frame.
  fullSequenceRollout: True
  hybridInitProb: 1.0
  enableEvaluation: True
  # Strict release evaluation uses PhysX actor-pair records.  Training keeps
  # the inexpensive GPU distance proxy.
  # Fast GPU evaluation uses the explicitly labeled proxy.  Set
  # --exact_contact_evaluation --pipeline cpu for PhysX actor-pair records.
  useExactContactEvaluation: False
  evaluationStableFrames: 10
  evaluationFinalPositionThreshold: 0.05
  evaluationFinalRotationThresholdDeg: 20.0
  evaluationMaxWrongContactSteps: 0
  # Wrong contacts are reported, but are not a universal failure condition:
  # an unseen task may use a valid interaction strategy absent from the GT.
  evaluationRequireNoWrongContact: False
  # Evaluation must measure rollouts rather than reject finite references.
  validateReferenceFK: False
  # ProtoMotions and Isaac agree within millimetres on the main body.  The
  # terminal finger capsules differ by at most ~12.3 mm / 8.9 degrees.
  fkMaxPositionError: 0.015
  fkMaxRotationErrorDeg: 10.0
  dataFPS: 30
  dataFramesScale: 1
  # Evaluate every converted sequence; each environment is bound to one.
  dataSub: ['*']
  ballSize: 1.
  numObs: 3858
  motion_file: theia_data
  robotType: "smplx/theia.xml"
  objectDensity:
    default: 1000
    CupBlue: 1200
    KettleGreen: 1850
  requireObjectDensity: False
  correctContactDistance: 0.05
  referenceAngularVelocityLimit: 20.0
  # Evaluate task completion without allowing GT contact timing to terminate
  # the rollout. Actor-pair contact is still reported as a separate metric.
  contactRewardMode: "soft"
  enableContactFailureTermination: False
  enableWristFailureTermination: False
  enableObjectContactPhaseTermination: False
  contactFailureGraceFrames: 30
  enableTrainingDiagnostics: False
  enableStepDiagnostics: False
  adaptiveRolloutFromLatestContact: False
  fingerBonusWeight: 0.05
  wristBonusWeight: 0.10
  graspBonusWeight: 0.025
  wrongContactPenalty: 0.0
  terminalObjectPoseFrames: 30
  terminalObjectPoseBonusWeight: 0.10
  localRootObs: False
  keyBodies: ["L_Hip", "L_Knee", "L_Ankle", "L_Toe", "R_Hip", "R_Knee", "R_Ankle", "R_Toe", "Torso", "Spine", "Chest", "Neck", "Head", "L_Thorax", "L_Shoulder", "L_Elbow", "L_Wrist", "R_Thorax", "R_Shoulder", "R_Elbow", "R_Wrist"]
  contactBodies: ["L_Hip", "L_Knee", "L_Ankle", "L_Toe", "R_Hip", "R_Knee", "R_Ankle", "R_Toe", "Torso", "Spine", "Chest", "Neck", "Head", "L_Thorax", "L_Shoulder", "L_Elbow", "L_Wrist", "R_Thorax", "R_Shoulder", "R_Elbow", "R_Wrist", "L_Index3", "L_Middle3", "L_Pinky3", "L_Ring3", "L_Thumb3", "R_Index3", "R_Middle3", "R_Pinky3", "R_Ring3", "R_Thumb3"]
  terminationHeight: 0.15
  enableEarlyTermination: True
  physicalBufferSize: 1

  asset:
    assetRoot: "intermimic/data/assets"

  plane:
    staticFriction: 0.9
    dynamicFriction: 0.9
    restitution: 0.1

  rewardWeights:
    p: 30.
    r: 2.5
    pv: 0.
    rv: 0.
    op: 5.0
    or: 1.0
    opv: 0.1
    orv: 0.
    ig: 5.
    cg_hand: 5.
    cg_other: 5.
    cg_all: 3.
    finger: 5.0
    eg1: 0.00002
    eg2: 0.00002
    eg3: 0.000000001

sim:
  substeps: 4
  physx:
    num_threads: 4
    solver_type: 1
    num_position_iterations: 8
    num_velocity_iterations: 2
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1.0

  flex:
    num_inner_iterations: 10
    warm_start: 0.25
